<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minimalistyczna biblioteka gier w stylu Steam">
    <title>Kontakt — GAMELIB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar"><div class="inner">
        <div class="logo">GAME<span>LIB</span></div>
        <nav><ul><li><a href="index.html">Sklep</a></li><li><a href="oferta.html">Biblioteka</a></li><li><a href="galeria.html">Galeria</a></li><li><a href="o-nas.html">O projekcie</a></li><li><a href="kontakt.html" class="active">Kontakt</a></li></ul></nav>
    </div></div>
    <main>
        <section class="panel">
            <h2>Napisz do nas</h2>
            <form action="#" method="post">
                <label for="nick">Nick</label>
                <input type="text" id="nick" name="nick" placeholder="np. ShadowSniper_PL" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="np. gracz@poczta.pl" required>

                <label for="wiadomosc">Wiadomość</label>
                <textarea id="wiadomosc" name="wiadomosc" rows="5" placeholder="Twoja wiadomość" required></textarea>

                <button type="submit" class="btn">Wyślij</button>
            </form>
        </section>

        <section class="panel">
            <h2>Inne sposoby kontaktu</h2>
            <ul class="list">
                <li>Steam: <a href="https://steamcommunity.com/" target="_blank" rel="noopener">Społeczność Steam</a></li>
                <li>E-mail: <a href="mailto:kontakt@gamelib.example">kontakt@gamelib.example</a></li>
            </ul>
        </section>
    </main>
    <footer>&copy; 2026 GAMELIB — projekt edukacyjny inspirowany wyglądem Steam | <a href="https://store.steampowered.com/" target="_blank" rel="noopener">Steam</a></footer>
</body>
</html>
